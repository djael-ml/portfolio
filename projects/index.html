<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djaël MOLA - Projets</title>
    <meta name="description" content="Projets open-source de Djaël MOLA">
    <meta property="og:title" content="Djaël MOLA - Projets">
    <meta property="og:description" content="Découvrez les projets open-source et les réalisations de Djaël MOLA.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="stylesheet" href="/assets/fonts/outfit/index.css">
    <link rel="stylesheet" href="/assets/icons/regular/style.css">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="custom-cursor"></div>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navigation -->
    <nav class="glass-nav">
        <div class="nav-content">
            <a href="/" class="logo">DM.</a>
            <button class="burger-btn" aria-label="Menu">
                <i class="ph ph-list"></i>
            </button>
            <ul class="nav-links">
                <li><a href="/">Accueil</a></li>
                <li><a href="/about/">À propos & Compétences</a></li>
                <li><a href="/projects/">Projets</a></li>
            </ul>
            <div class="nav-controls" style="display: flex; gap: 1rem;">
                <button id="theme-toggle" class="icon-btn" aria-label="Changer le thème">
                    <i class="ph ph-sun"></i>
                </button>
                <button class="icon-btn burger-btn" aria-label="Menu">
                    <i class="ph ph-list"></i>
                </button>
            </div>
        </div>
    </nav>

    <main>
        <section id="projects" class="projects-section" style="min-height: 80vh;">
            <div class="section-header animate-on-scroll">
                <h2>Projets Réalisés</h2>
                <p>Découvrez mes meilleures réalisations et projets open-source.</p>
            </div>
            <div id="github-projects" class="projects-grid">
                <!-- Squelettes de chargement -->
                <div class="glass-card project-card skeleton"></div>
                <div class="glass-card project-card skeleton"></div>
                <div class="glass-card project-card skeleton"></div>
                <div class="glass-card project-card skeleton"></div>
            </div>
        </section>
    </main>

    <footer id="contact" class="glass-footer">
        <div class="footer-content animate-on-scroll">
            <h2>Contactez-moi</h2>
            <div class="contact-links">
                <a href="mailto:djaelmola@gmail.com" class="contact-item">
                    <div class="icon-wrapper"><i class="ph ph-envelope-simple"></i></div>
                    <span>Email</span>
                </a>
                <a href="https://github.com/djael-ml" target="_blank" class="contact-item">
                    <div class="icon-wrapper"><i class="ph ph-github-logo"></i></div>
                    <span>GitHub</span>
                </a>
                <a href="/assets/docs/CV - Djaël MOLA.pdf" target="_blank" class="contact-item">
                    <div class="icon-wrapper"><i class="ph ph-file-pdf"></i></div>
                    <span>CV</span>
                </a>
            </div>
            <button id="open-contact-modal" class="btn secondary-btn contact-btn"><i class="ph ph-envelope-open"></i> Contacter</button>

            <p class="copyright">© 2026 Djaël MOLA.</p>
        </div>
    </footer>

    <!-- Contact Modal -->
    <div id="contact-modal" class="modal-overlay">
        <div class="modal-content glass-card">
            <button id="close-contact-modal" class="icon-btn close-modal"><i class="ph ph-x"></i></button>
            <h2>Envoyer un message</h2>
            <form action="https://api.web3forms.com/submit" method="POST" class="contact-form">
                <input type="hidden" name="access_key" value="ba34ec1b-ff70-4a72-8b4b-f81474bbb099">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Votre Nom / Entreprise" required>
                    <input type="email" name="email" placeholder="Votre Email" required>
                </div>
                <select name="subject" required class="form-select">
                    <option value="" disabled selected>-- Choisissez un sujet --</option>
                    <option value="Proposition de stage / alternance">Proposition de stage / alternance</option>
                    <option value="Proposition de poste / mission">Proposition de poste / mission</option>
                    <option value="Échange technique / Autre">Échange technique / Autre</option>
                </select>
                <textarea name="message" placeholder="Votre Message (optionnel)" rows="3"></textarea>
                <button type="submit" class="btn primary-btn"><i class="ph ph-paper-plane-tilt"></i> Envoyer</button>
            </form>
        </div>
    </div>

    <script src="/assets/js/vanilla-tilt.min.js"></script>
    <script src="/assets/js/script.js"></script>
</body>
</html>
